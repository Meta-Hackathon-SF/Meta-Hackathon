name: Validate integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Disposable synthetic test databases/roles only, never a deployment.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GQ_TEST_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
      GROUP_QUESTS_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            server/app/requirements-dev.lock
            server/privacy/requirements.txt
      - name: Install pinned app and privacy dependencies
        run: |
          python -m pip install -r server/app/requirements-dev.lock -r server/privacy/requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check Kai-owned Python formatting and lint
        run: |
          python -m ruff check server/app tests/orchestration
          python -m ruff format --check server/app tests/orchestration
      - name: Require an actual PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['GQ_TEST_ADMIN_DSN'], connect_timeout=5) as connection:
              assert connection.execute('SELECT 1').fetchone() == (1,)
          PY
      - name: Run combined offline and database-backed tests
        run: python -m pytest tests -q --junitxml=.pytest_cache/ci-results.xml
      - name: Reject silently skipped privacy tests
        run: |
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('.pytest_cache/ci-results.xml')
          privacy = [case for case in root.findall('.//testcase') if 'privacy' in case.get('classname', '')]
          assert privacy, 'No privacy tests were collected'
          assert not any(case.find('skipped') is not None for case in privacy), 'Privacy tests were skipped'
          PY

  frontend:
    name: Frontend and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
